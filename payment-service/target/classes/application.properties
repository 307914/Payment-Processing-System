# Application
spring.application.name=payment-processing-system
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=postgres
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.payments.event

# JWT
app.jwt.secret=Yg8J7VywDufVf2+rOk+hqv2S/eqkfHO9VjzOzgd/3Uk=
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000

# Rate Limiting
app.rate-limit.max-requests=10
app.rate-limit.window-seconds=60

# Outbox Poller
app.outbox.poll-interval-ms=500

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
